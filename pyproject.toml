[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soc-assistant"
version = "0.1.0"
description = "Local LLM + RAG copilot for SOC analysts (alerts, playbooks, MITRE ATT&CK)"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
